<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">
  <div class="header">Night Chat</div>

  <div class="chat" id="chat">
    <div class="bubble bot">
      我在。慢慢來，先呼吸一下。
    </div>
  </div>

  <div class="input-area">
    <input id="input" placeholder="想說什麼…" />
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
