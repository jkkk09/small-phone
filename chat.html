<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f2f2f7; height: 100vh; display: flex; flex-direction: column; margin: 0; padding-top: 20px;}
        #box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 12px; border-radius: 18px; font-size: 14px; position: relative; line-height: 1.5; }
        .bot { background: white; align-self: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .user { background: #007AFF; color: white; align-self: flex-end; }
        .thought { color: #d63384; font-size: 11px; font-style: italic; display: block; border-bottom: 1px solid #f0f0f0; margin-bottom: 5px; padding-bottom: 5px; }
        .transfer { background: #fa9d3b; color: white; border-radius: 8px; padding: 10px; margin-top: 5px; }
        .input-area { background: #f6f6f6; padding: 10px; display: flex; gap: 8px; border-top: 0.5px solid #ddd; }
    </style>
</head>
<body>
    <div id="box"><div class="msg bot"><span class="thought">「終於又見面了...」</span>在忙什麼呢？</div></div>
    <div class="input-area">
        <input id="inp" type="text" class="flex-1 rounded-full px-4 py-2 border-none outline-none" placeholder="傳送訊息...">
        <button onclick="send()" class="bg-blue-500 text-white px-4 rounded-full font-bold">↑</button>
    </div>
    <script>
        const API_KEY = "AIzaSyAqqNpixsOTGmv9-4xdDgBYmuJKaddYWjQ"; 

        async function send() {
            const val = document.getElementById('inp').value;
            if(!val || API_KEY.includes("你的")) return;
            append('user', val);
            document.getElementById('inp').value = '';

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `你是一個溫柔且具備保護欲的哥哥，回覆時必須包含 [心聲內容]，若提到金錢請加 {TRANSFER:金額}。使用者說：${val}` }] }] })
                });
                const data = await res.json();
                const reply = data.candidates[0].content.parts[0].text;
                const thought = reply.match(/\[(.*?)\]/)?.[1] || "在心裡守護妳";
                const transfer = reply.match(/\{TRANSFER:(.*?)\}/)?.[1];
                let cleanText = reply.replace(/\[.*?\]/g, '').replace(/\{TRANSFER:.*?\}/g, '');
                let html = `<span class="thought">「${thought}」</span>${cleanText}`;
                if(transfer) html += `<div class="transfer">🧧 轉帳給妳 ¥ ${transfer}</div>`;
                append('bot', html);
            } catch(e) { append('bot', '訊號有點弱，等我一下喔。'); }
        }
        function append(role, text) {
            const d = document.createElement('div'); d.className = `msg ${role}`; d.innerHTML = text;
            document.getElementById('box').appendChild(d);
            document.getElementById('box').scrollTop = document.getElementById('box').scrollHeight;
        }
    </script>
</body>
</html>
